name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        submodules: true
        path: reloader

    # The reloader embeds the bootloader, so build that first, the same way
    # wasp-os does.
    - name: Checkout bootloader
      uses: actions/checkout@v7
      with:
        repository: wasp-os/wasp-bootloader
        ref: wasp-os
        submodules: true
        # The bootloader Makefile derives its version from `git describe --tags`
        fetch-depth: 0
        path: bootloader

    - name: Checkout wasp-os tools
      uses: actions/checkout@v7
      with:
        repository: wasp-os/wasp-os
        sparse-checkout: tools/hex2c.py
        sparse-checkout-cone-mode: false
        path: wasp-os

    - name: Install toolchain
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-arm-none-eabi
        pip3 install intelhex adafruit-nrfutil
        pip3 install -r reloader/lib/mcuboot/scripts/requirements.txt

    - name: Build bootloader
      run: |
        make -C bootloader -j$(nproc) BOARD=pinetime_nrf52832 all genhex
        hexmerge.py \
          bootloader/_build-pinetime_nrf52832/pinetime_nrf52832_bootloader-*-nosd.hex \
          bootloader/lib/softdevice/s132_nrf52_6.1.1/s132_nrf52_6.1.1_softdevice.hex \
          -o bootloader.hex
        python3 wasp-os/tools/hex2c.py bootloader.hex > reloader/src/boards/pinetime/bootloader.h

    - name: Build reloader
      run: make -C reloader -j$(nproc) BOARD=pinetime

    - name: Upload reloader
      uses: actions/upload-artifact@v7
      with:
        name: pinetime-reloader
        path: reloader/build-pinetime/*.zip
